name: devcontainer-claude-code

networks:
  # internal:true gives this network no gateway, so traffic cannot leave it. That is
  # the isolation -- not iptables, so root or a nested --privileged container has
  # nothing to undo.
  isolated:
    internal: true
  egress:

services:
  proxy:
    build:
      context: ./proxy
    networks:
      isolated:
        aliases:
          - proxy
      egress:
    restart: unless-stopped
    environment:
      # See .env: "allowlist" (default) restricts squid to allowed-domains.txt,
      # "open" lifts it without touching the topology below.
      PROXY_MODE: ${PROXY_MODE:-allowlist}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3128"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    # The docker-in-docker feature would set this anyway (as it does init: true and the
    # /var/lib/docker volume, left implicit); stated because the container is useless
    # without it. Isolation holds: privileged grants capabilities inside this
    # container's own network namespace, which still has no route out.
    privileged: true
    networks:
      - isolated
    depends_on:
      proxy:
        condition: service_healthy
    # Chromium (Playwright MCP) crashes with the default 64MB /dev/shm.
    shm_size: 1gb
    # devcontainer.json's overrideCommand defaults to false for compose, so the
    # service must stay up on its own.
    command: sleep infinity
    environment:
      # devcontainer.json's containerEnv would work too (the CLI merges it here), but
      # every variable lives in one place.
      #
      # Claude Code's global config is ${CLAUDE_CONFIG_DIR:-$HOME}/.claude.json; pointing
      # it at the mounted ~/.claude keeps it in the persisted volume.
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      # Not used to reach the proxy -- only read by verify-isolation.sh, to tell an
      # expected open-mode success from a filtering failure.
      PROXY_MODE: ${PROXY_MODE:-allowlist}
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
    volumes:
      # The two persisted named volumes are devcontainer.json `mounts`, not here:
      # ${devcontainerId} in their names resolves only there. The CLI merges them in.
      - ..:/workspaces/devcontainer-claude-code:cached
      # A host PulseAudio socket is mounted here too, for Claude Code's /voice -- from
      # docker-compose.audio.yml, which scripts/detect-audio.sh generates on the host
      # because only the host knows whether such a socket exists.
