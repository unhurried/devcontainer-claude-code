# Selected instead of squid.conf when PROXY_MODE=open (see ../.env). Same shape as
# squid.conf minus the two ACLs that implement the domain allowlist:
#
#   - `allowed_domains` / the final `allow allowed_domains` -- there is no allowlist to
#     enforce.
#   - `ip_literal` -- that rule exists solely to stop a raw address from riding in on a
#     hostname's PTR record and matching the allowlist (see squid.conf and the design
#     doc). With every destination already allowed, there is nothing left for a raw
#     address to bypass.
#
# Everything else -- the port restriction, CONNECT gate, cache, and log target -- stays
# identical, so this loosens only *which domains* are reachable, not the port/method
# constraints or the network topology that keeps dev off the internet except through
# squid.
http_port 3128

acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT   method CONNECT

http_access deny  !Safe_ports
http_access deny  CONNECT !SSL_ports
http_access allow all

cache deny all

# See squid.conf for why this is a file and not /dev/stdout.
access_log stdio:/var/log/squid/access.log
