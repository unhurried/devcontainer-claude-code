# Used instead of squid.conf when PROXY_MODE=open (see ../.env). squid.conf minus the
# two allowlist ACLs: `allowed_domains` (nothing to enforce) and `ip_literal` (it only
# stops a raw address from matching the allowlist via PTR -- nothing left to bypass).
# Port and CONNECT limits are unchanged, as is the topology keeping dev behind squid.
http_port 3128

acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT   method CONNECT

http_access deny  !Safe_ports
http_access deny  CONNECT !SSL_ports
http_access allow all

cache deny all

# See squid.conf for why this is a file and not /dev/stdout.
access_log stdio:/var/log/squid/access.log
