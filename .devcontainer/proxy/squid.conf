# No `ports:` in docker-compose.yml, so 3128 is reachable only from the compose networks.
http_port 3128

acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
# IPv4 or IPv6 literal. IPv6 is hardening only; neither compose network enables it.
acl ip_literal      dstdom_regex ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ^[0-9a-fA-F:]*:[0-9a-fA-F:.]*$
acl Safe_ports      port 80 443
acl SSL_ports       port 443
acl CONNECT         method CONNECT

# Deny raw addresses: squid would reverse-resolve them, and e.g. 140.82.121.6
# reverse-resolves under .github.com and would be allowed.
http_access deny  ip_literal
# Limit plain GET to 80/443 too, not only CONNECT.
http_access deny  !Safe_ports
http_access deny  CONNECT !SSL_ports
# entrypoint.sh rewrites this line to `allow all` under PROXY_MODE=open.
http_access allow allowed_domains
http_access deny  all

cache deny all

# Don't leak the dev container's address in plain-HTTP headers.
via off
forwarded_for delete

# Not /dev/stdout: squid drops privileges and cannot open it. entrypoint.sh tails this file.
access_log stdio:/var/log/squid/access.log
