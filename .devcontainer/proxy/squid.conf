# Binds all interfaces, but docker-compose.yml publishes no `ports:`, so 3128 is
# reachable only from the `egress`/`isolated` networks, never the host.
http_port 3128

acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
# IPv4 dotted quad, or an IPv6 literal (squid has already stripped brackets/zone). The
# IPv6 half is hardening only: neither compose network enables IPv6 today.
acl ip_literal      dstdom_regex ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ^[0-9a-fA-F:]*:[0-9a-fA-F:.]*$
acl Safe_ports      port 80 443
acl SSL_ports       port 443
acl CONNECT         method CONNECT

# Deny raw addresses first: for an IP URL squid falls back to a PTR lookup, and
# 140.82.121.6 reverse resolves under .github.com -- without this rule it is *allowed*.
# Forcing names squid resolves forward stops a client pairing an allowed hostname with
# an address of its choosing.
http_access deny  ip_literal
# The distribution config's stock Safe_ports is gone and the CONNECT rule below covers
# CONNECT only; without this, GET http://<allowed-host>:22/ would dial port 22.
http_access deny  !Safe_ports
http_access deny  CONNECT !SSL_ports
# entrypoint.sh rewrites this line to `allow all` under PROXY_MODE=open.
http_access allow allowed_domains
http_access deny  all

cache deny all

# NOT /dev/stdout: squid drops to the `squid` user, cannot open the container's stdout
# pipe, and exits FATAL if told to. entrypoint.sh tails this file instead.
access_log stdio:/var/log/squid/access.log
