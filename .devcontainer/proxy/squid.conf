http_port 3128

acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
# IPv6 is hardening only; neither compose network enables it.
acl ip_literal      dstdom_regex ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ^[0-9a-fA-F:]*:[0-9a-fA-F:.]*$
acl Safe_ports      port 80 443
acl SSL_ports       port 443
acl CONNECT         method CONNECT

# Raw addresses would be reverse-resolved: 140.82.121.6 resolves under .github.com.
http_access deny  ip_literal
# Plain GET too, not only CONNECT.
http_access deny  !Safe_ports
http_access deny  CONNECT !SSL_ports
# Symlinked by entrypoint.sh to access-mode.${PROXY_MODE}.conf.
include /etc/squid/access-mode.conf
http_access deny  all

cache deny all

# Don't leak the dev container's address in plain-HTTP headers.
via off
forwarded_for delete

# Not /dev/stdout: unwritable after squid drops privileges. entrypoint.sh tails this file.
access_log stdio:/var/log/squid/access.log
