# Binds all interfaces. Exposure is bounded by the `egress`/`isolated` bridges alone:
# docker-compose.yml publishes no `ports:` for this service, so 3128 is reachable
# only from containers on those networks, never from the host or beyond.
http_port 3128

acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
# IPv4 dotted quad, or an IPv6 literal (hex groups and colons, optional zone/brackets
# already stripped by squid). The IPv6 half is hardening only: neither compose network
# enables IPv6 today, so squid has no IPv6 path out to begin with.
acl ip_literal      dstdom_regex ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ^[0-9a-fA-F:]*:[0-9a-fA-F:.]*$
acl Safe_ports      port 80 443
acl SSL_ports       port 443
acl CONNECT         method CONNECT

# Deny raw addresses first. Not because squid would otherwise skip the allowlist --
# for an IP-based URL squid falls back to a PTR lookup, and 140.82.121.6 reverse
# resolves under .github.com, so removing this rule makes https://140.82.121.6/
# *allowed*. The rule forces every destination to be a name squid resolves forward
# itself, so a client cannot pair an allowed hostname with an address of its choosing.
http_access deny  ip_literal
# The stock Safe_ports ACL is gone with the distribution config, and the CONNECT rule
# below covers CONNECT only: without this a plain GET http://<allowed-host>:22/ would
# have squid dial port 22 on every allowlisted domain.
http_access deny  !Safe_ports
http_access deny  CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny  all

cache deny all

# NOT /dev/stdout: squid drops to the `squid` user and cannot open the container's
# stdout pipe, and exits with FATAL if told to. entrypoint.sh tails these instead.
access_log stdio:/var/log/squid/access.log
