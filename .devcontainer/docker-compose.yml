name: devcontainer-claude-code

networks:
  # internal:true means Docker creates no gateway for this network and drops traffic
  # that tries to leave it. That, not iptables inside the container, is the isolation:
  # there is nothing for a root process or a --privileged nested container to undo.
  isolated:
    internal: true
  egress:

services:
  proxy:
    build:
      context: ./proxy
    networks:
      isolated:
        aliases:
          - proxy
      egress:
    restart: unless-stopped
    environment:
      # See .env: "allowlist" (default) restricts squid to allowed-domains.txt, "open"
      # lifts the domain allowlist without touching the network topology below.
      PROXY_MODE: ${PROXY_MODE:-allowlist}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3128"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    # Stated here rather than left to the docker-in-docker feature: the CLI does apply
    # feature-metadata privileged to a compose service, but the dev container is
    # useless without it, so the file says so. This does not weaken the isolation:
    # privileged grants capabilities inside this container's own network namespace,
    # and that namespace still has no route out.
    #
    # The same merge path applies the feature's own init: true and its /var/lib/docker
    # volume, so neither needs restating here.
    privileged: true
    networks:
      - isolated
    depends_on:
      proxy:
        condition: service_healthy
    # Chromium (Playwright MCP) crashes with the default 64MB /dev/shm.
    shm_size: 1gb
    # devcontainer.json's overrideCommand defaults to false for compose, so the
    # service must stay up on its own.
    command: sleep infinity
    environment:
      # devcontainer.json's containerEnv would also reach this service -- the CLI
      # merges it into the compose environment -- but one place is clearer, so every
      # variable the container needs lives here.
      #
      # Claude Code's global config lives at ${CLAUDE_CONFIG_DIR:-$HOME}/.claude.json
      # (account binding, trust flags). Pointing it at the mounted ~/.claude keeps it,
      # plus projects/, sessions/ and history, inside the persisted volume.
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      # Not used to reach the proxy -- only read by verify-isolation.sh so it knows
      # whether an unlisted host answering is expected (PROXY_MODE=open) or a failure.
      PROXY_MODE: ${PROXY_MODE:-allowlist}
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
    volumes:
      # The two persisted named volumes are declared as devcontainer.json `mounts`,
      # not here: their names key off ${devcontainerId}, which resolves only in
      # devcontainer.json. The CLI merges those mounts into this service's volumes.
      - ..:/workspaces/devcontainer-claude-code:cached
